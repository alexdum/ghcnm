name: Monthly Data Update

on:
  schedule:
    - cron: '0 0 15 * *' # Midnight UTC on the 15th of every month
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository with full history and LFS support
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
          
      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      # Step 3: Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas pyarrow
          
      # Step 4: Fetch and Process Data (This might take some time)
      - name: Fetch and Process Data
        run: |
          mkdir -p misc/data
          python misc/Python/ghcnm_read_prec.py
          python misc/Python/ghcnm_read_tavg.py
          
      # Step 5: Configure Git User
      - name: Configure Git User
        run: |
          git config --global user.email "alexandru.dumitrescu@gmail.com"
          git config --global user.name "alexdum"
          
      # Step 6: Commit and Push to GitHub main branch
      - name: Commit and Push to GitHub
        run: |
          git add www/data/tabs/
          # Only commit if there are actual changes
          git diff-index --quiet HEAD || git commit -m "Automated monthly data update"
          git push origin main
          
      # Step 7: Deploy Snapshot to Hugging Face Hub (Without History)
      - name: Deploy Snapshot to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git checkout --orphan deploy
          git add -A
          git commit -m "Deploy snapshot without history (Scheduled Update)"
          git remote add hf https://alexdum:${HF_TOKEN}@huggingface.co/spaces/alexdum/ghcnm
          git push hf deploy:main --force
